spring:
  application:
    name: barkit

  data:
    redis:
      enabled: true
      host: localhost
      port: 6379

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${AWS_DB_URL}
    username: ${AWS_DB_USER}
    password: ${AWS_DB_PW}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

cloud:
  aws:
    s3:
      bucket: barkit-bk
    region:
      static: ap-northeast-2
    stack:
      auto: false
    credentials:
      accessKey: ${AWS_ACCESS_KEY_ID}
      secretKey: ${AWS_SECRET_ACCESS_KEY}

google:
  api:
    base-url: https://places.googleapis.com
    key: ${GOOGLE_API_KEY}

jwt:
  token:
    secretKey: ${JWT_SECRET_KEY}
    expiration:
      access: 3600000
      refresh: 2592000000

kakao:
  oauth:
    rest-api-key: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    redirect-uri-allowlist:
      - http://localhost:5173/oauth/kakao/callback
      - http://localhost:8080/oauth/kakao/callback
      - http://localhost:8080/oauth/kakao/code

naver:
  oauth:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    state-secret: ${NAVER_STATE_SECRET}
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me
    redirect-uri-allowlist:
      - http://localhost:5173/oauth/naver/callback
      - http://localhost:8080/oauth/naver/callback
      - http://localhost:8080/oauth/naver/code