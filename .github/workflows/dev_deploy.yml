name: CI/CD Pipeline

on:
  push:
    branches: [ dev ]  # develop 브랜치에 push가 일어날 때 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3  # 저장소 코드 체크아웃

      - name: Set up JDK 17  # Java 개발 킷 설정
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make application.yml  # application.yml 파일 생성
        run: |
          cd ./src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > ./application.yml
        shell: bash

      - name: Grant execute permission for gradlew  # gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Build with Gradle  # Gradle을 사용하여 프로젝트 빌드
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build

      - name: Upload build artifact  # 빌드된 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: umcBarkitServer
          path: build/libs/*.jar

  deploy:
    needs: build  # build 작업이 성공적으로 완료된 후 실행
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact  # 이전 단계에서 업로드한 아티팩트 다운로드
        uses: actions/download-artifact@v4
        with:
          name: umcBarkitServer
          path: build/libs/

      - name: Deploy to EC2  # EC2에 배포
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

          AWS_DB_URL: ${{ secrets.AWS_DB_URL }}
          AWS_DB_USER: ${{ secrets.AWS_DB_USER }}
          AWS_DB_PW: ${{ secrets.AWS_DB_PW }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_STATE_SECRET: ${{ secrets.NAVER_STATE_SECRET }}


        run: |
          echo "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          jar_file=$(find build/libs -name '*.jar' ! -name '*plain.jar' | head -n 1)
          
          scp -i private_key.pem -o StrictHostKeyChecking=no "$jar_file" \
            $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/umcBarkitServer.jar
          
          ssh -i private_key.pem -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST "
            # 이 앱 jar만 종료 (전체 java 죽이지 않기)
            pgrep -f '/home/$EC2_USERNAME/umcBarkitServer.jar' | xargs -r kill -15
            sleep 5
          
            # prod + 환경변수 주입
            export SPRING_PROFILES_ACTIVE=prod
            export AWS_DB_URL='$AWS_DB_URL'
            export AWS_DB_USER='$AWS_DB_USER'
            export AWS_DB_PW='$AWS_DB_PW'
            export AWS_ACCESS_KEY_ID='$AWS_ACCESS_KEY_ID'
            export AWS_SECRET_ACCESS_KEY='$AWS_SECRET_ACCESS_KEY'
            export GOOGLE_API_KEY='$GOOGLE_API_KEY'
            export JWT_SECRET_KEY='$JWT_SECRET_KEY'
            export KAKAO_REST_API_KEY='$KAKAO_REST_API_KEY'
            export KAKAO_CLIENT_SECRET='$KAKAO_CLIENT_SECRET'
            export NAVER_CLIENT_ID='$NAVER_CLIENT_ID'
            export NAVER_CLIENT_SECRET='$NAVER_CLIENT_SECRET'
            export NAVER_STATE_SECRET='$NAVER_STATE_SECRET'
  

            nohup java -jar /home/$EC2_USERNAME/umcBarkitServer.jar \
              --spring.profiles.active=prod \
              > /home/$EC2_USERNAME/app.log 2>&1 &
          "
          
          rm -f private_key.pem